[pytest]
pythonpath = .

# File patterns to treat as tests
python_files = 
    test_*.py
    *_test.py

# Enable asyncio support for FastAPI tests
asyncio_mode = auto

# Coverage configuration
addopts = 
    --cov=interactive_city_dashboard
    --cov-report=term-missing
    --cov-report=html

testpaths = interactive_city_dashboard/tests

# Ignore noisy warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Hypothesis settings
hypothesis_profile = default

