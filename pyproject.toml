[project]
name = "interactive-city-dashboard"
version = "0.1.0"
description = "Explore world cities with an interactive map, charts, and live data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash==4.2.0",
    "flask==3.1.3",
    "folium==0.20.0",
    "kaleido>=1.5.2",
    "pandas==2.3.3",
    "plotly==6.8.0",
    "reportlab>=5.1.2",
    "requests==2.32.5",
    "sqlalchemy==2.0.48",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = [
    "test_*.py",
    "*_test.py",
]
asyncio_mode = "auto"
testpaths = ["interactive_city_dashboard/tests"]

addopts = [
    "--cov=interactive_city_dashboard",
    "--cov-report=term-missing",
    "--cov-report=html",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

hypothesis_profile = "default"
